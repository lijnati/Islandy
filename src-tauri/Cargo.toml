[package]
name = "islandy"
version = "0.3.1"
description = "A beautiful, context-aware Dynamic Island for Windows."
authors = ["Islandy contributors"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# `islandy_lib` avoids a name clash with the `islandy` binary on Windows.
name = "islandy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tauri-plugin-global-shortcut = "2"
# Activity receiver/CLI wire format and the Claude Code settings editor.
# `preserve_order` keeps the user's key order when Islandy edits
# `~/.claude/settings.json` (both are already in Tauri's dependency tree).
serde_json = { version = "1", features = ["preserve_order"] }
# The per-installation receiver token (OS CSPRNG); already a Tauri dependency.
getrandom = "0.3"
tauri-plugin-single-instance = "2"
# Signed updates from GitHub Releases (minisign signature checked before install).
tauri-plugin-updater = "2"
# HTTPS for the weather widget (Open-Meteo). Same reqwest/rustls the updater
# already brings in; `ring` is installed as the process' crypto provider.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Devices_Geolocation",
  "Devices_Radios",
  "Foundation",
  "Graphics_Imaging",
  "Media_Control",
  "Networking_Connectivity",
  "Storage_Streams",
  "System_Power",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# Names the WinRT async types (`IAsyncOperation`, …) used by the media backend;
# the same version `windows` 0.62 already depends on.
windows-future = "0.3"
# `#[implement]` (Core Audio callbacks) expands to paths in `windows_core`;
# the same version `windows` 0.62 already depends on.
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# Already a transitive dependency of Tauri on Linux; used only for dev-host window sizing.
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
