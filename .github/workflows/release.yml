name: Release

# Builds the Windows NSIS installer with MSVC, signs the update artifacts and publishes
# them to a GitHub Release together with `latest.json` (what installed copies of Islandy
# check for automatic updates).
#
# Triggered by pushing a `v*` tag (e.g. v0.2.0), or manually from the Actions tab: enter a
# tag; if it doesn't exist yet it is created on the selected branch's commit.
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key (contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Their public half is `plugins.updater.pubkey` in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0); created from the selected branch if missing"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the tag if it exists
        id: ref
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "refs/tags/${TAG}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the version and signing secrets
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${version}" != "${TAG%%-*}" ] && [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} doesn't match the app version ${version} (src-tauri/tauri.conf.json)."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates can't be signed. See docs/release.md."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: |
          pnpm test
          pnpm test:rust

      - name: Release notes
        id: notes
        shell: bash
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "Islandy ${TAG}" > release-notes.md; fi
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "body<<__NOTES__"
            cat release-notes.md
            echo
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          commitish: ${{ steps.ref.outputs.sha }}
          releaseName: Islandy ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.notes.outputs.prerelease }}
          # Uploads the installer, its .sig and latest.json (the updater manifest).
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
